<style>

<canvas id="game"></canvas><div id="wash"></div>

<section id="title" class="screen"><div class="poster"><p class="kicker">오늘의 주인공</p><h1>인정욕구<br>채우기</h1><p class="lede">뭘 하든 사람들이 알아보는 밤.</p><label class="name">사람들이 외칠 이름<input id="name" maxlength="10" placeholder="이름" value="현규" autocomplete="off"></label><div class="modes"><button class="mode" data-mode="music">솔로한다<small>아무 음이나</small></button><button class="mode" data-mode="art">전시한다<small>아무 선이나</small></button></div><p class="tiny">소리는 첫 버튼을 누른 뒤 시작됩니다.</p></div></section>
